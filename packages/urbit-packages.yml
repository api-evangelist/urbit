description: >-
  First-party Urbit client libraries live under the @urbit scope on npm,
  published from the urbit GitHub org. The flagship is @urbit/http-api, the
  JavaScript library for talking to a running ship's Eyre HTTP server
  (authentication, pokes, subscriptions, scries, threads) — documented at
  https://docs.urbit.org/build-on-urbit/tools/js-libs/http-api-guide. No
  first-party PyPI package exists (PyPI "urbit"/"urbit-http-api" are missing);
  Rust crates (urbit-http-api, urbit-q, urbit-ob) are community-maintained and
  excluded from official listing. Versions/dates as observed on the npm
  registry at generation time.
