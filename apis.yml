aid: urbit
name: Urbit
description: >-
  Urbit is an open-source personal server platform combining Urbit ID — a
  self-sovereign, Ethereum-anchored identity system (Azimuth) — with Urbit OS,
  a deterministic operating system built on the Nock virtual machine and the
  Hoon language. Every user runs their own ship, a self-hosted server whose
  Eyre HTTP vane exposes the platform's API surface: cookie-authenticated
  channels (JSON actions in, Server-Sent Events out), read-only scries, and
  threads, with first-party JavaScript clients published under the @urbit npm
  scope. The project is notably agent-native: urbit.org publishes a canonical
  llms.txt, machine-oriented markdown mirrors, public Agent Skills, and a
  documented MCP path for driving ships from LLM clients. Originally
  bootstrapped by Tlon and backed by investors including Pantera Capital, the
  network's identity layer trades as ERC-721 NFTs with a Layer 2 naive rollup
  (roller.urbit.org) that eliminates gas costs.
