apis:
- name: Urbit Ship HTTP API (Eyre)
  description: >-
    The HTTP interface of every Urbit ship, served by the Eyre kernel vane.
    Clients authenticate by POSTing the ship's web login code to /~/login for
    an urbauth session cookie, then interact through channels (PUT JSON
    action arrays — poke, subscribe, ack, unsubscribe, delete — to
    /~/channel/{uid}, with responses as Server-Sent Events), read-only scries
    (GET /~/scry/{app}{path}.{mark}), and Spider threads. Self-hosted: every
    ship serves its own endpoint; there is no central production host.
  humanURL: https://docs.urbit.org/urbit-os/kernel/eyre/external-api-ref
  baseURL: https://{ship-host}
  tags:
  - HTTP
  - Server-Sent Events
  - Channels
  - Self-Hosted
  properties:
  - type: Documentation
    url: https://docs.urbit.org/urbit-os/kernel/eyre
  - type: APIReference
    url: https://docs.urbit.org/urbit-os/kernel/eyre/external-api-ref
- name: Azimuth Layer 2 Roller HTTP RPC-API
  description: >-
    The HTTP RPC-API of Azimuth's Layer 2 naive rollup roller, primarily
    intended for interacting with Bridge. Tlon operates the default public
    roller at roller.urbit.org, which batches Urbit ID transactions (key
    rotations, transfers, spawns) onto Ethereum without per-user gas costs.
  humanURL: https://docs.urbit.org/urbit-id/l2/layer2-api
  baseURL: https://roller.urbit.org
  tags:
  - JSON-RPC
  - Ethereum
  - Identity
  - Layer 2
  properties:
  - type: Documentation
    url: https://docs.urbit.org/urbit-id/l2/roller
  - type: APIReference
    url: https://docs.urbit.org/urbit-id/l2/layer2-api
